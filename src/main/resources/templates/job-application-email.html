<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Job Application</title></head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr><td align="center" style="padding:40px 20px;">
      <table width="600" cellpadding="0" cellspacing="0" border="0"
             style="background-color:#ffffff;border-radius:8px;
                    box-shadow:0 2px 8px rgba(0,0,0,0.1);overflow:hidden;">
        <tr>
          <td style="background-color:#AC5055;padding:24px 32px;">
            <h1 style="margin:0;color:#ffffff;font-size:22px;">Elite CSP – New Job Application</h1>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;">
            <p style="margin:0 0 24px;color:#555555;font-size:15px;">
              A new job application has been submitted through the Elite CSP website.
            </p>
            <table width="100%" cellpadding="8" cellspacing="0" border="0"
                   style="border-collapse:collapse;">
              <tr style="background-color:#f9f9f9;">
                <td style="width:120px;font-weight:bold;color:#AC5055;font-size:14px;
                           border-bottom:1px solid #eeeeee;">Name</td>
                <td style="color:#333333;font-size:14px;
                           border-bottom:1px solid #eeeeee;">{{NAME}}</td>
              </tr>
              <tr>
                <td style="width:120px;font-weight:bold;color:#AC5055;font-size:14px;
                           border-bottom:1px solid #eeeeee;">Email</td>
                <td style="color:#333333;font-size:14px;
                           border-bottom:1px solid #eeeeee;">
                  <a href="mailto:{{EMAIL}}" style="color:#AC5055;">{{EMAIL}}</a></td>
              </tr>
              <tr style="background-color:#f9f9f9;">
                <td style="width:120px;font-weight:bold;color:#AC5055;font-size:14px;
                           border-bottom:1px solid #eeeeee;">City</td>
                <td style="color:#333333;font-size:14px;
                           border-bottom:1px solid #eeeeee;">{{CITY}}</td>
              </tr>
              <tr>
                <td style="width:120px;font-weight:bold;color:#AC5055;font-size:14px;
                           border-bottom:1px solid #eeeeee;">Resume / CV</td>
                <td style="color:#333333;font-size:14px;
                           border-bottom:1px solid #eeeeee;">
                  {{ATTACHMENT_NAME}} (attached)
                </td>
              </tr>
              <tr style="background-color:#f9f9f9;">
                <td style="width:120px;font-weight:bold;color:#AC5055;font-size:14px;
                           vertical-align:top;">Cover Letter</td>
                <td style="color:#333333;font-size:14px;line-height:1.6;">{{MESSAGE}}</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="background-color:#f4f4f4;padding:16px 32px;text-align:center;
                     color:#aaaaaa;font-size:12px;">
            This application was submitted via the Elite CSP website.
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
