# ==============================================================================
# SonarQube Project Configuration – Elite CSP Project
# ==============================================================================

sonar.projectKey=elite-csp-project
sonar.projectName=Elite CSP Project
sonar.projectVersion=1.0.0

# Source directories (relative to each module; Maven plugin discovers them automatically)
sonar.sources=.
sonar.java.binaries=target/classes

# Exclude generated and build artefacts from analysis
sonar.exclusions=**/target/**,**/*.xml,**/*.properties

# Java version for accurate analysis
sonar.java.source=21
